<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knut-Bug | Bug Groupe</title>
  <link rel="stylesheet" href="/knut.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 450px;
      padding: 40px 20px;
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 11px;
      color: #6b7280;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    .input-box {
      width: 100%;
      padding: 15px 18px;
      background: #111118;
      border: 1.5px solid #374151;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.2s;
    }
    .input-box:focus { border-color: #8b5cf6; }
    .input-box::placeholder { color: #4b5563; font-size: 12px; }
    .command-select {
      width: 100%;
      padding: 15px 18px;
      background: #111118;
      border: 1.5px solid #374151;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }
    .btn-execute {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }
    .btn-back {
      background: transparent;
      border: 1px solid #374151;
      color: #6b7280;
    }
    .result {
      font-size: 13px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    .result.ok { background: #064e3b; color: #6ee7b7; }
    .result.err { background: #4c0519; color: #fca5a5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">BUG GROUPE</div>
    <div class="subtitle">EXECUTER UN BUG SUR UN GROUPE</div>

    <input type="text" class="input-box" id="groupLink" placeholder="Lien du groupe (https://chat.whatsapp.com/...)">
    
    <select class="command-select" id="commandSelect">
      <option value="">Selectionner une commande</option>
      <option value="vortex">Vortex</option>
      <option value="knut-ravage">Knut-Ravage</option>
    </select>

    <button class="btn btn-execute" id="btnExecute" onclick="executeBug()">[>>] EXECUTER</button>
    <div class="result hidden" id="result"></div>

    <!-- Suivi des executions en ARRIERE-PLAN : le job tourne cote serveur,
         tu peux fermer la page il continue, et se reaffiche a ton retour. -->
    <div id="jobBoard"></div>

    <a href="/buglist" class="btn btn-back">[<] Retour</a>
  </div>

  <script src="/js/job-ui.js"></script>
  <script>
    /* Meme correctif que /bugtarget : la commande part en ARRIERE-PLAN.
     * AVANT : `await fetch()` attendait la fin de la commande (24h) => page
     * figee, puis message rouge quand le proxy coupait la connexion.
     * MAINTENANT : reponse immediate (202 + jobId) + carte de progression. */

    const linkInput = document.getElementById('groupLink');
    const commandSelect = document.getElementById('commandSelect');
    const btnExecute = document.getElementById('btnExecute');
    const BTN_LABEL = '[>>] EXECUTER';

    JobUI.mount('#jobBoard');

    let hideTimer = null;
    function showResult(ok, msg, sticky) {
      const el = document.getElementById('result');
      el.className = `result ${ok ? 'ok' : 'err'}`;
      el.textContent = msg;
      clearTimeout(hideTimer);
      if (!sticky) hideTimer = setTimeout(() => el.classList.add('hidden'), 9000);
    }

    function setBusy(busy) {
      btnExecute.disabled = busy;
      btnExecute.style.opacity = busy ? '0.6' : '1';
      btnExecute.textContent = busy ? 'Lancement...' : BTN_LABEL;
    }

    async function executeBug() {
      const groupLink = linkInput.value.trim();
      const command = commandSelect.value;

      if (!groupLink) {
        showResult(false, 'Veuillez entrer le lien du groupe');
        return;
      }
      if (!command) {
        showResult(false, 'Veuillez sélectionner une commande');
        return;
      }

      setBusy(true);
      showResult(true, '⚡ Lancement de la commande...', true);

      const out = await JobUI.launch({ command, groupLink });

      setBusy(false);

      if (out.ok && out.queued) {
        showResult(
          true,
          out.message || '✔ Commande lancée en arrière-plan. Tu peux fermer la page.',
          true
        );
      } else if (out.blocked) {
        showResult(false, out.message, true);
      } else {
        showResult(false, out.message || 'Erreur', true);
      }
    }

    linkInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') executeBug();
    });

    JobUI.on('change', jobs => {
      const active = jobs.find(j => j.status === 'running');
      if (active && document.getElementById('result').classList.contains('hidden')) {
        showResult(
          true,
          `⚡ ${active.command} est toujours en cours sur ${active.label} — ` +
            `${JobUI.humanDuration(active.remainingMs)} restantes.`,
          true
        );
      }
    });
  </script>
</body>
</html>
