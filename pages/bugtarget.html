<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knut-Bug | Bug Numero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 450px;
      padding: 40px 20px;
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 11px;
      color: #6b7280;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    .input-box {
      width: 100%;
      padding: 15px 18px;
      background: #111118;
      border: 1.5px solid #374151;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.2s;
    }
    .input-box:focus { border-color: #f59e0b; }
    .input-box::placeholder { color: #4b5563; }
    .command-select {
      width: 100%;
      padding: 15px 18px;
      background: #111118;
      border: 1.5px solid #374151;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }
    .btn-execute {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
    }
    .btn-back {
      background: transparent;
      border: 1px solid #374151;
      color: #6b7280;
    }
    .result {
      font-size: 13px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    .result.ok { background: #064e3b; color: #6ee7b7; }
    .result.err { background: #4c0519; color: #fca5a5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">BUG NUMERO</div>
    <div class="subtitle">EXECUTER UN BUG SUR UNE CIBLE</div>

    <input type="tel" class="input-box" id="targetNumber" placeholder="237600000000">
    
    <select class="command-select" id="commandSelect">
      <option value="">Selectionner une commande</option>
      <option value="delaynih-spam">delaynih-Bug</option>
      <option value="crashnotif-spam">crashnotif-Bug</option>
      <option value="carnage-bug">Caranage-Bug</option>
    </select>

    <button class="btn btn-execute" id="btnExecute" onclick="executeBug()">[>>] EXECUTER</button>
    <div class="result hidden" id="result"></div>

    <!-- ============================================================== -->
    <!--  SUIVI DES EXECUTIONS EN ARRIERE-PLAN                           -->
    <!--  Le job tourne COTE SERVEUR : cette carte reste a jour meme si   -->
    <!--  tu fermes l'onglet, et se reaffiche toute seule a ton retour.   -->
    <!-- ============================================================== -->
    <div id="jobBoard"></div>

    <a href="/buglist" class="btn btn-back">[<] Retour</a>
  </div>

  <script src="/js/job-ui.js"></script>
  <script>
    /* ==================================================================
     *  AVANT : `await fetch('/api/bot/command')` attendait la FIN de la
     *  commande. Comme carnage-bug / crashnotif / delaynih bouclent
     *  pendant 24h, la reponse n'arrivait JAMAIS :
     *    - la page restait figee sur "Execution en cours... Veuillez patienter"
     *    - le proxy (Render / Cloudflare) coupait la connexion au bout de
     *      ~30-100s => message ROUGE "Erreur de connexion au serveur"
     *    - ...pendant que la boucle continuait de tourner sur le serveur,
     *      sans plus aucun retour pour l'utilisateur.
     *
     *  MAINTENANT : le serveur lance un JOB en arriere-plan et repond en
     *  ~100 ms (HTTP 202 + jobId). Le navigateur n'attend plus rien :
     *    - confirmation verte IMMEDIATE
     *    - carte de progression en temps reel (Socket.IO + polling)
     *    - tu peux fermer la page, quitter le site, eteindre ton telephone :
     *      le job continue jusqu'au bout de ses 24h et se reaffiche ici
     *    - bouton STOP pour l'arreter proprement quand tu veux
     * ================================================================== */

    const targetInput = document.getElementById('targetNumber');
    const commandSelect = document.getElementById('commandSelect');
    const btnExecute = document.getElementById('btnExecute');
    const BTN_LABEL = '[>>] EXECUTER';

    JobUI.mount('#jobBoard');

    let hideTimer = null;
    function showResult(ok, msg, sticky) {
      const el = document.getElementById('result');
      el.className = `result ${ok ? 'ok' : 'err'}`;
      el.textContent = msg;
      clearTimeout(hideTimer);
      // Le message ne s'efface plus au bout de 5s : il reste lisible.
      if (!sticky) hideTimer = setTimeout(() => el.classList.add('hidden'), 9000);
    }

    function setBusy(busy, label) {
      btnExecute.disabled = busy;
      btnExecute.style.opacity = busy ? '0.6' : '1';
      btnExecute.textContent = busy ? (label || 'Lancement...') : BTN_LABEL;
    }

    async function executeBug() {
      const rawTarget = targetInput.value.trim();
      const command = commandSelect.value;

      let target = rawTarget.replace(/\D/g, '');
      if (target.startsWith('0')) target = target.replace(/^0+/, '');

      if (!target || target.length < 8) {
        showResult(false, 'Veuillez entrer un numéro cible valide (ex: 237621631200)');
        return;
      }
      if (!command) {
        showResult(false, 'Veuillez sélectionner une commande');
        return;
      }

      // Anti double-lancement : un job tourne deja sur cette cible.
      const already = JobUI.activeFor(target);
      if (already) {
        showResult(
          false,
          `⚠️ ${already.command} tourne déjà sur ce numéro (${JobUI.humanDuration(already.remainingMs)} restantes). ` +
            `Arrête-le ci-dessous avant d'en relancer un.`,
          true
        );
        return;
      }

      setBusy(true);
      showResult(true, '⚡ Lancement de la commande...', true);

      // NE BLOQUE PLUS : la reponse arrive immediatement, le job continue seul.
      const out = await JobUI.launch({ command, target, args: [target] });

      setBusy(false);

      if (out.ok && out.queued) {
        showResult(
          true,
          out.message || '✔ Commande lancée en arrière-plan. Tu peux fermer la page : ' +
            "l'exécution continue jusqu'à son terme (24h).",
          true
        );
      } else if (out.blocked) {
        // Liste blanche (js/config.js > WHITELIST_NUMBERS) : rien n'a ete envoye.
        showResult(false, out.message, true);
      } else {
        showResult(false, out.message || "Échec de l'exécution", true);
      }
    }

    // Entree directe dans le champ = lancer la commande.
    targetInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') executeBug();
    });

    // Au retour sur la page : si un job tourne encore, on le signale.
    JobUI.on('change', jobs => {
      const active = jobs.find(j => j.status === 'running');
      if (active && document.getElementById('result').classList.contains('hidden')) {
        showResult(
          true,
          `⚡ ${active.command} est toujours en cours sur ${active.label} — ` +
            `${JobUI.humanDuration(active.remainingMs)} restantes.`,
          true
        );
      }
    });
  </script>
</body>
</html>
